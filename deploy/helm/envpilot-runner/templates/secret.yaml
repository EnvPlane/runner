{{- if and (or .Values.controlPlane.token .Values.controlPlane.configToken) (not .Values.controlPlane.existingSecret) (not .Values.controlPlane.allowUnsafePlaintextTokens) -}}
{{- fail "controlPlane.token/configToken render plaintext bootstrap credentials. Create the bootstrap Secret out-of-band and set controlPlane.existingSecret, or set controlPlane.allowUnsafePlaintextTokens=true only for local non-GitOps testing." -}}
{{- end -}}
{{- if and (or .Values.controlPlane.token .Values.controlPlane.configToken) (not .Values.controlPlane.existingSecret) .Values.controlPlane.allowUnsafePlaintextTokens -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envpilot-runner.tokenSecretName" . }}
  labels:
    {{- include "envpilot-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.controlPlane.token }}
  {{ .Values.controlPlane.tokenKey }}: {{ .Values.controlPlane.token | quote }}
  {{- end }}
  {{- if .Values.controlPlane.configToken }}
  {{ .Values.controlPlane.configTokenKey }}: {{ .Values.controlPlane.configToken | quote }}
  {{- end }}
{{- end }}
