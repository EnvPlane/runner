replicaCount: 1

image:
  repository: ghcr.io/envpilot/runner
  pullPolicy: IfNotPresent
  tag: "0.1.1"

imagePullSecrets: []

command: []
args:
  - runner

nameOverride: ""
fullnameOverride: ""

controlPlane:
  url: ""
  # GitOps-safe bootstrap:
  # create the Secret out-of-band with the control plane generated kubectl command,
  # then set existingSecret. Do not commit live bootstrap tokens in values files.
  token: ""
  configToken: ""
  existingSecret: ""
  # Unsafe local-only escape hatch for rendering token/configToken into a Secret.
  allowUnsafePlaintextTokens: false
  tokenKey: token
  configTokenKey: project-config-token
  heartbeatIntervalSeconds: 30
  authPersistence:
    # Persist the post-registration runnerAuthToken on a writable volume so
    # normal container/pod restarts do not reuse the one-time bootstrap token.
    enabled: true
    mountPath: /var/lib/envpilot-runner/auth
    fileName: runner-auth-token
    volumeName: runner-auth
    # Create a small PVC by default. This keeps the runtime auth token across
    # rollout-created pod replacements. Set createClaim=false to use emptyDir.
    createClaim: true
    claimName: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Mi
    existingClaim: ""
    # Optional post-registration credential Secret for externally managed
    # persistence. If set, the runner reads runnerAuthToken from this Secret.
    existingSecret: ""
    runnerAuthTokenKey: runner-auth-token

dependencyWait:
  enabled: true
  healthPath: /api/v1/health

project:
  id: ""
  configUrl: ""
  namespace: envpilot-system
  clusterId: ""
  deploymentMode: helm
  runnerId: ""

service:
  targetPort: 8080

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  discovery:
    # cluster keeps read-only discovery across the cluster. Set to "namespace"
    # to render a namespace-scoped Role/RoleBinding instead.
    scope: cluster
    namespace: ""
    # Kubernetes RBAC cannot grant secret metadata-only access. Keep this false
    # unless the runner explicitly needs to discover Secret objects.
    readSecrets: false
  featureEnvWriter:
    enabled: true
    # Writer mode makes feature namespace write permissions explicit.
    # releaseNamespace: least-privilege default; writer Role/RoleBinding is
    #   rendered only in the Helm release namespace.
    # preconfiguredNamespaces: render one namespace-scoped writer Role/RoleBinding
    #   for each namespace listed in namespaces.
    # generatedFeatureNamespaces: render one namespace-scoped writer Role/RoleBinding
    #   for each namespace listed in generatedNamespaces. The control plane/runner
    #   should populate this list when feature namespaces are generated ahead of
    #   deployment. Do not broaden to cluster-wide writes for generated namespaces.
    mode: releaseNamespace
    # Legacy override used only by releaseNamespace mode. Empty means .Release.Namespace.
    namespace: ""
    namespaces: []
    generatedNamespaces: []
    allowNetworkPolicies: false
    allowFluxResources: false
  secretManager:
    enabled: false
    namespace: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
