name: Publish runner image and chart (main)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-main.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: envpilot/bootstrap
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: bootstrap
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: envpilot/deploy
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: deploy
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: envpilot/frontend
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: frontend
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache: true
      - name: Test runner
        working-directory: runner
        run: go test ./...
      - name: Verify Runner has no local chart source
        run: deploy/scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE/deploy" --runner "$GITHUB_WORKSPACE/runner"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/runner
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
