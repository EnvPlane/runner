name: Publish runner image and chart (main)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'apps/**'
      - 'internal/**'
      - 'deploy/helm/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-main.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: envpilot/bootstrap
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: bootstrap
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: envpilot/deploy
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: deploy
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: envpilot/frontend
          token: ${{ secrets.REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
          path: frontend
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache: true
      - name: Test runner
        working-directory: runner
        run: go test ./...
      - uses: azure/setup-helm@v4
      - name: Lint and package runner chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm lint runner/deploy/helm/envpilot-runner
          base_version="$(awk -F': ' '$1 == "version" {print $2; exit}' runner/deploy/helm/envpilot-runner/Chart.yaml)"
          version="${base_version}-main.${GITHUB_RUN_NUMBER}"
          helm package runner/deploy/helm/envpilot-runner --destination dist --version "$version" --app-version "$version"
      - name: Authenticate to GHCR for charts
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish runner chart
        run: helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/runner
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
