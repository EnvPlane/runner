name: Publish runner image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'Dockerfile'
      - 'apps/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-main.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-runner-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'envpilot/runner' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.published.outputs.component }}
      repository: ${{ steps.published.outputs.repository }}
      tag: ${{ steps.published.outputs.tag }}
      digest: ${{ steps.published.outputs.digest }}
      metadata: ${{ steps.published.outputs.metadata }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: runner
      - id: source_read_auth
        name: Select source checkout authentication
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          FALLBACK_PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "method=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FALLBACK_PAT" ]]; then
            echo "method=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using fine-grained PAT fallback for source checkouts."
          else
            echo "No source-read GitHub App credentials or fallback PAT is configured." >&2
            exit 1
          fi
      - id: source_read_app
        if: steps.source_read_auth.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bootstrap,deploy,frontend
          permission-contents: read
      - uses: actions/checkout@v5
        with:
          repository: envpilot/bootstrap
          token: ${{ steps.source_read_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          path: bootstrap
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: envpilot/deploy
          token: ${{ steps.source_read_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          path: deploy
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: envpilot/frontend
          token: ${{ steps.source_read_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          path: frontend
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache: true
      - name: Test runner
        working-directory: runner
        run: go test ./...
      - name: Verify Runner has no local chart source
        run: deploy/scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE/deploy" --runner "$GITHUB_WORKSPACE/runner"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/runner
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - id: published
        name: Emit immutable image metadata
        env:
          COMPONENT: runner
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/runner
          TAG: sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          metadata="$(jq -cn \
            --arg component "$COMPONENT" \
            --arg repository "$REPOSITORY" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            '{component: $component, repository: $repository, tag: $tag, digest: $digest}')"
          printf '%s\n' "$metadata" | tee image-metadata.json
          {
            echo "component=$COMPONENT"
            echo "repository=$REPOSITORY"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "metadata=$metadata"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-image-metadata
          path: image-metadata.json
          if-no-files-found: error
      - id: dispatch_auth
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        name: Select deploy dispatch authentication
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          FALLBACK_PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "method=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FALLBACK_PAT" ]]; then
            echo "method=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using fine-grained PAT fallback for deploy dispatch."
          else
            echo "No deploy-dispatch GitHub App credentials or fallback PAT is configured." >&2
            exit 1
          fi
      - id: deploy_dispatch_app
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.dispatch_auth.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: deploy
          permission-contents: write
      - name: Dispatch immutable image update with GitHub App
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.dispatch_auth.outputs.method == 'app'
        env:
          GH_TOKEN: ${{ steps.deploy_dispatch_app.outputs.token }}
          METADATA: ${{ steps.published.outputs.metadata }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --request POST \
            --url "https://api.github.com/repos/${{ github.repository_owner }}/deploy/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -cn --argjson payload "$METADATA" --arg source_repository "${{ github.repository }}" --arg source_revision "${{ github.sha }}" '{event_type:"component-image-published",client_payload:($payload + {source_repository:$source_repository,source_revision:$source_revision,publication_id:($payload.component + ":" + $source_revision + ":" + $payload.digest)})}')"
      - name: Dispatch immutable image update with PAT fallback
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.dispatch_auth.outputs.method == 'pat'
        env:
          GH_TOKEN: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
          METADATA: ${{ steps.published.outputs.metadata }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 3 --request POST \
            --url "https://api.github.com/repos/${{ github.repository_owner }}/deploy/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -cn --argjson payload "$METADATA" --arg source_repository "${{ github.repository }}" --arg source_revision "${{ github.sha }}" '{event_type:"component-image-published",client_payload:($payload + {source_repository:$source_repository,source_revision:$source_revision,publication_id:($payload.component + ":" + $source_revision + ":" + $payload.digest)})}')"
