name: Runner CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: source_read_auth
        name: Select source authentication
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          FALLBACK_PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          if [[ -n "$CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then echo "method=app" >> "$GITHUB_OUTPUT"; elif [[ -n "$FALLBACK_PAT" ]]; then echo "method=pat" >> "$GITHUB_OUTPUT"; else echo "No source-read credentials configured." >&2; exit 1; fi
      - id: source_read_app
        if: steps.source_read_auth.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: contracts,gitops
          permission-contents: read
      - name: Configure private Go modules
        env:
          SOURCE_TOKEN: ${{ steps.source_read_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          echo 'GOPRIVATE=github.com/envpilot/*' >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${SOURCE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Enforce schema ownership
        run: |
          test ! -d migrations/postgres
          test ! -f internal/server/openapi.json
          test ! -d internal/postgres
          test ! -f internal/gitops/renderer.go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Use published runtime modules
        run: |
          go mod edit -dropreplace=github.com/envpilot/contracts
          go mod edit -dropreplace=github.com/envpilot/gitops
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          repo-checkout: false
      - run: go test ./...
      - name: Verify production package reachability
        run: ./scripts/check-production-reachability.sh
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - run: go test -race ./...
      - run: go test -coverprofile=cover.out ./...
      - name: Enforce coverage floor
        run: |
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN { if (total < 20) { print "coverage below 20%: " total "%"; exit 1 } }'
